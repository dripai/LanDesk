[package]
name = "landesk-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
sha2 = "=0.10.9"
anyhow = "1"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = "=0.6.0"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }

[features]
test-support = []
