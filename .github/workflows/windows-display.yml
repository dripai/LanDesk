name: Windows server

on:
  push:
    branches: [main, "codex/**"]
    paths: ["src/**", "client/**", "web/**", "Cargo.toml", "Cargo.lock", "vendor/virtual-display/**", "scripts/bundle_windows_display.py", "docs/architecture.md", ".github/workflows/windows-display.yml"]
  pull_request:
    paths: ["src/**", "client/**", "web/**", "Cargo.toml", "Cargo.lock", "vendor/virtual-display/**", "scripts/bundle_windows_display.py", "docs/architecture.md", ".github/workflows/windows-display.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AWS_LC_SYS_PREBUILT_NASM: "1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Format
        run: cargo +stable fmt --check
      - name: Check Windows component
        run: cargo +stable clippy --locked --lib --bin LanDeskDisplay --bin LanDeskServer -- -D warnings
      - name: Windows library tests
        run: cargo +stable test --locked --lib
      - name: Native SCM and setup API tests (administrator runner, no driver installation)
        run: cargo +stable test --locked --lib native_setup_ -- --ignored --test-threads=1
      - name: Client to server subsystem integration
        run: |
          cargo +stable build --manifest-path client/Cargo.toml --locked --no-default-features --example desktop_probe
          if ($LASTEXITCODE -ne 0) { throw 'Client probe build failed' }
          $env:LANDESK_CLIENT_PROBE = (Resolve-Path target/debug/examples/desktop_probe.exe).Path
          cargo +stable test --locked --lib actual_client_crosses_subsystem_memory_backend_and_browser_authentication -- --ignored
      - name: Build Windows x64
        run: cargo +stable build --locked --release --bin LanDeskDisplay --bin LanDeskServer
      - name: Read-only status smoke test
        run: |
          $state = & target/release/LanDeskDisplay.exe --status | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $state.installed) { throw 'Unexpected display device status on clean runner' }
      - name: Package
        run: python scripts/bundle_windows_display.py --server-exe target/release/LanDeskServer.exe --output target/LanDeskServer-windows-x64
      - uses: actions/upload-artifact@v7
        with:
          name: LanDeskServer-windows-x64
          path: target/LanDeskServer-windows-x64/
          if-no-files-found: error
          retention-days: 30
