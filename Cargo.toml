[package]
name = "landesk"
default-run = "landesk"
version = "0.1.1"
edition = "2024"
rust-version = "1.87"
description = "Mac 局域网远程桌面，通过 SSH 隧道和浏览器连接"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "=0.8.9", features = ["ws"] }
futures-util = "0.3"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "=0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_StationsAndDesktops", "Win32_System_Threading", "Win32_System_Services", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Authentication_Identity", "Win32_System_Registry"] }

[[bin]]
name = "LanDeskServer"
path = "src/windows_server_main.rs"

[[bin]]
name = "LanDeskDisplay"
path = "src/windows_main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
libc = "=0.2.190"
enigo = { version = "=0.6.1", default-features = false }
objc2 = "=0.6.3"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
screencapturekit = { version = "=11.0.0", features = ["macos_14_2"] }

[dev-dependencies]
tokio-tungstenite = "=0.29.0"

[[test]]
name = "native_run_loop"
harness = false

[[test]]
name = "virtual_display"
harness = false

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
strip = "debuginfo"
